name: Webhook Integration Tests

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  schedule:
    # Run webhook tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  webhook-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vault_webhook_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.2
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, pgsql, pdo_pgsql

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Copy environment file
      run: cp .env.example .env

    - name: Install dependencies
      run: |
        composer install --no-progress --prefer-dist --optimize-autoloader
        npm ci

    - name: Build assets
      run: npm run build

    - name: Configure application
      run: |
        php artisan key:generate
        echo "DB_CONNECTION=pgsql" >> .env
        echo "DB_HOST=localhost" >> .env
        echo "DB_PORT=5432" >> .env
        echo "DB_DATABASE=vault_webhook_test" >> .env
        echo "DB_USERNAME=postgres" >> .env
        echo "DB_PASSWORD=postgres" >> .env
        echo "QUEUE_CONNECTION=database" >> .env

    - name: Run migrations and seed test data
      run: |
        php artisan migrate --force
        php artisan db:seed --class=WebhookTestingSeeder

    - name: Start Laravel application
      run: |
        php artisan serve --host=0.0.0.0 --port=8000 &
        sleep 5
      env:
        APP_ENV: testing

    - name: Run webhook-specific tests
      run: |
        vendor/bin/phpunit --testsuite=Feature --filter=Webhook
        vendor/bin/phpunit tests/Feature/BrowserTabNotificationTest.php
        vendor/bin/phpunit tests/Unit/WebhookProcessingServiceTest.php

    - name: Test webhook endpoints manually
      run: |
        # Test webhook endpoint is responding
        curl -f http://localhost:8000/api/v1/health || exit 1

        # Test webhook signature validation
        payload='{"test": "data"}'
        signature=$(echo -n "$payload" | openssl dgst -sha256 -hmac "test-webhook-secret-123" | sed 's/^.* //')

        response=$(curl -s -w "%{http_code}" \
          -X POST http://localhost:8000/api/v1/webhook/github \
          -H "Content-Type: application/json" \
          -H "X-GitHub-Event: ping" \
          -H "X-GitHub-Delivery: test-delivery" \
          -H "X-Hub-Signature-256: sha256=$signature" \
          -d "$payload")

        echo "Webhook endpoint response: $response"

    - name: Run queue worker for 30 seconds
      run: |
        timeout 30 php artisan queue:work --timeout=10 || true

    - name: Check application logs
      if: always()
      run: |
        if [ -f storage/logs/laravel.log ]; then
          echo "=== Application Logs ==="
          tail -n 50 storage/logs/laravel.log
        fi

  browser-tab-integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vault_browser_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.2
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, pgsql, pdo_pgsql

    - name: Install dependencies
      run: composer install --no-progress --prefer-dist --optimize-autoloader

    - name: Configure application for browser tab testing
      run: |
        cp .env.example .env
        php artisan key:generate
        echo "DB_CONNECTION=pgsql" >> .env
        echo "DB_HOST=localhost" >> .env
        echo "DB_PORT=5432" >> .env
        echo "DB_DATABASE=vault_browser_test" >> .env
        echo "DB_USERNAME=postgres" >> .env
        echo "DB_PASSWORD=postgres" >> .env

    - name: Run migrations and seed browser tab test data
      run: |
        php artisan migrate --force
        php artisan db:seed --class=BrowserTabTestingSeeder

    - name: Start application with queue worker
      run: |
        php artisan serve --host=0.0.0.0 --port=8000 &
        php artisan queue:work --timeout=60 &
        sleep 5

    - name: Test SSE endpoints
      run: |
        # Test SSE endpoint for user 11111
        response=$(curl -s -m 5 \
          -H "Accept: text/event-stream" \
          -H "Cache-Control: no-cache" \
          "http://localhost:8000/sse/notifications/11111" || echo "timeout")

        echo "SSE endpoint response: $response"

    - name: Run browser tab notification tests
      run: |
        vendor/bin/phpunit tests/Feature/BrowserTabNotificationTest.php --verbose

    - name: Check for pending deliveries
      run: |
        php artisan tinker --execute="
        echo 'Pending deliveries: ' . \App\Models\TriggerDelivery::where('status', 'pending')->count();
        echo 'Total deliveries: ' . \App\Models\TriggerDelivery::count();
        "